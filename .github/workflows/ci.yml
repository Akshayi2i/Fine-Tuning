name: CI

# CPU-only and fast, by design. Nothing here needs a GPU or a live Azure account:
# heavy dependencies stay in optional extras, the Blob layer runs against an
# in-memory backend, and every GPU-bound step is exercised through its own
# interface rather than by running it. A CI that needed a pod would not run on
# every push, and a check that does not run is not a check.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,eval,dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        # The whole tree, not a subset: a package excluded from type checking is
        # a package where a signature change breaks a caller silently. The 268
        # errors older than this check are frozen per file; a new one fails
        # (scripts/check_type_errors.py).
        run: |
          mypy common artifact_registry registry_utils data_pipeline inference_core training evaluation calibration serving postprocessing testing orchestration pilot azure_service contracts adapters > mypy.txt || true
          cat mypy.txt
          python -m scripts.check_type_errors mypy.txt

      - name: Generated prompt artefacts are current
        # testing/prompts/*.prompt.txt are rendered from common.prompts. A stale
        # file means the checked-in prompt and the served prompt have diverged,
        # which degrades a fine-tuned model with no other symptom.
        run: python -m testing.render_prompts --check

      - name: Tests
        # GPU and live-Azure tests are marked and excluded; everything else runs,
        # once: the coverage report it writes feeds the gate below.
        run: |
          pytest -q -m "not gpu and not azure" \
            --cov=common --cov=training --cov=data_pipeline --cov=inference_core \
            --cov=evaluation --cov=calibration --cov=registry_utils --cov=orchestration \
            --cov=serving --cov=postprocessing --cov=azure_service \
            --cov-report=term-missing --cov-report=json:coverage.json

      - name: Coverage gate on the correctness-critical modules
        # These are the modules whose failures are silent: broken label masking
        # does not show in a loss curve, a leaked split inflates every number,
        # and a prompt that drifts between corpus build and inference degrades
        # accuracy with no other symptom. Each module is held to its own floor
        # (scripts/check_module_coverage.py), the served path included (review R8).
        run: python -m scripts.check_module_coverage coverage.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: No secrets or real document data in the committed files
        # Matches the shapes of real secrets (a storage key's 86+ base64
        # characters, a SAS signature, a private key block) and SSN-shaped
        # strings in the fixtures - not the words: the old pattern matched
        # every `AccountKey=...` placeholder and failed every push (review R5).
        # The public Azurite key is allowed in azure_service/DEPLOY.md only.
        run: python scripts/scan_secrets.py
