# The OCR that writes every page text the model reads (arch §8a).
#
# Read by the OCR stage (the training corpus) AND by serving. One pin, both
# readers: the model learns how MinerU formats a page - headings, tables,
# reading order - so text from another MinerU is input it was not trained on.
#
# Decision 2026-10-23: the MinerU 4 API served on the pod, for both. The corpus
# is OCR'd through it (data_pipeline.ocr.served_ocr.ServedMinerUEngine) and so
# is every served document (ServedOcr); each task reports the version that read
# it, and a task read by another version is refused. The in-process MinerU 3.4.5
# (run_mineru.MinerUEngine) stays for a corpus already read by it.
#
# The server's address and token are not configuration but environment:
# MINERU_URL and MINERU_TOKEN (FIDEON_REMOTE_TOKEN when unset).

served_mineru:
  # What the server must report as its parser_version.
  version: "4.0.12"
  # Its quality/speed trade-off; part of the pin, since another tier reads a
  # page with other models. `basic`: its local lightweight models.
  tier: basic

# Read every page by OCR - a scan and a PDF with a text layer ("hybrid") alike.
# Decision 2026-10-27: production takes scanned and hybrid policies, and the
# first commercial training set is both. With this on, the text the model reads
# is MinerU's OCR of the page image in training and in serving, never a clean
# text layer in one and OCR in the other. Part of the OCR pin: each reading
# records it, a corpus read the other way is refused, and serving refuses a
# release trained under the other setting (scripts.served_adapter.assert_ocr_pin).
read_every_page_by_ocr: true
