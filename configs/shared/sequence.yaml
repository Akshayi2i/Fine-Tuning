# Sequence cap per task (arch v2.1 §7a).
#
# Imported by dataset build, training AND serving, same as vision.yaml.
#
# WHY THESE ARE PER TASK: v1 used one cap of 8192 for everything. At the v1
# resolution a single US-Letter page costs roughly 2,400 visual tokens, so 8192
# could not hold a one-page ACORD with its schema, its image, its OCR text and
# its output - and the canonical three-page Loss Run in §7 overflowed before a
# single OCR token was added. Nothing detected it, because nothing compared image
# tokens against the cap. `cap_check.py` now does, and REJECTS rather than
# truncating: a truncated Loss Run trains the model to omit claim rows.
#
# Each cap below is composition + headroom, not a round number:
#   schema tokens + (pages x visual tokens) + OCR text + output
#
# TODO Phase 0 (spike item 4): confirm from the measured 99th percentile over 20
# documents per type. These are derived from the vision.yaml budgets; if the
# measured geometry differs, both files move together.

defaults:
  max_seq_len: 24576
  # Output is reserved, never borrowed from. The assistant span is the one thing
  # that must never be truncated - a clipped JSON output is an unparseable
  # training target and a silently short extraction at serving time.
  max_output_tokens: 2048

tasks:
  classify:
    max_seq_len: 4096
    max_output_tokens: 128
    composition: "page 1 thumbnail (~256) + enum schema + short JSON answer"

  extract:
    max_seq_len: 24576
    max_output_tokens: 2048
    composition: "schema 2-5k + <=4 pages x ~2.4k + OCR text + output <=2k"
    note: "ACORD default: all pages of the form in one call"

    # Extraction is ONE task - the model is conditioned on doc_type through the
    # prompt, not routed to a different task. What changes per type is the
    # budget: a routed policy sends up to 6 pages against an ACORD's 4, and its
    # schema is larger. Modelled as an override so `extract` stays one task in
    # the corpus, the prompt and the metrics.
    by_doc_type:
      policy:
        max_seq_len: 32768
        max_output_tokens: 3072
        composition: "schema 3-6k + <=6 routed pages x ~2.4k + OCR text + output <=3k"
        note: >
          The largest cap in the system. Phase 0 spike item 5 measures whether it
          fits on one 80GB+ card (an H200 141GB here) with gradient checkpointing; if not, ms-swift
          sequence parallelism over 2 GPUs comes before any ZeRO-3 config.

  lossrun_header:
    max_seq_len: 12288
    max_output_tokens: 1024
    composition: "header schema ~1k + 2 pages + output"

  lossrun_rows:
    max_seq_len: 20480
    max_output_tokens: 8192
    composition: "row schema ~1k + 1-3 window pages + rows output"
    note: >
      The window is sized by the planner so estimated output stays under
      max_output_tokens - this is the one task where OUTPUT, not input, is the
      binding constraint. Dense pages get a 1-page window for that reason.

  lossrun_totals:
    max_seq_len: 12288
    max_output_tokens: 1024
    composition: "totals schema ~0.5k + last 2 pages + output"

  # Policy decomposition (arch v2.1 7b). The one-call `extract` path stays for
  # short policies; these are what a 60-page policy is read with, because a
  # 6-page routed read of one silently drops everything past the sixth page.
  policy_declarations:
    max_seq_len: 32768
    max_output_tokens: 4096
    composition: "policy schema 3-6k + <=3 declarations pages x ~2.4k + OCR + output"
    note: >
      Measured on the pod (smoke run, 2026-09-29): complete declarations targets -
      every field of the reviewed gold - reach ~2,550 tokens, over the 2,048 first
      reserved, and a third of the documents were set aside for it. The window is
      already just the declarations pages, so the answer is reserved, not the
      window shrunk. 32,768 total fits one H200 (the spike measured 99 GB peak).

  policy_schedule:
    max_seq_len: 32768
    max_output_tokens: 12288
    composition: "row schema ~1k + window pages + rows output"
    note: >
      OUTPUT-bound, like lossrun_rows: the window is sized so the estimated rows
      fit max_output_tokens. A vehicle schedule runs to hundreds of rows, and a
      clipped assistant span is an unparseable target in training and a silently
      short extraction in serving. 12,288, not 8,192 (2026-10-07): on the SPEC_21
      set three seeds' schedule windows answered in 8,700-11,900 tokens and were
      set aside (93 documents), and one NYCM auto policy prints ~8,600 tokens of
      rows on a single page, so no smaller window could hold it. The pages a
      window reads come from what is left of max_seq_len after this reservation
      (expand_tasks.pages_per_extraction_call), so windows shrink by about a page.

  policy_endorsements:
    max_seq_len: 20480
    max_output_tokens: 3072
    composition: "endorsement schema ~1k + tagged endorsement pages + output"
