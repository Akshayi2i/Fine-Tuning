# Serving and inference config (IMPL-07, IMPL-11).
# Read by the inference core, the serving endpoint, and the testing harness -
# so all three generate identically. That is what makes test == prod true.

vision:
  # MUST equal configs/base_model.yaml vision.max_image_long_side_px.
  # A mismatch means serving the model a distribution it never trained on;
  # common.config.assert_resolution_parity() enforces it rather than trusting
  # two files to stay in step by hand.
  max_image_long_side_px: 1792

sequence:
  # MUST be at least the largest per-task cap in configs/shared/sequence.yaml
  # (arch v2.1 7a). It was 8192 here while policy extraction trains at 32768, so
  # a routed policy would have been truncated AT INFERENCE ONLY - trained on six
  # pages, served four - and nothing would have reported it as anything but
  # degraded accuracy on long documents. tests/test_parity.py asserts the
  # relationship rather than trusting two files to stay in step by hand.
  max_seq_len: 32768

generation:
  # Greedy by default: extraction is not a creative task, and a sampled output
  # would make the same document extract differently on two runs, which breaks
  # both reproducibility and the confidence calibration fitted on it.
  temperature: 0.0
  top_p: 1.0
  # At least every task's reserved max_output_tokens (configs/shared/sequence.yaml):
  # a smaller limit would cut at serving an answer training taught in full.
  max_new_tokens: 12288        # policy schedules reserve 12,288, Loss Run rows 8,192
  seed: 42

  # Mandatory. Per-token logprobs are the entire basis of per-field confidence
  # (arch 5). A backend that cannot return them is not a valid serving backend.
  logprobs: true
  # The token written and the best other one: their margin is each value's
  # near-tie margin (serving.near_tie_margin below). Sent to a served model as
  # the request's top_logprobs, to the in-process engine as SamplingParams.logprobs.
  # Greedy decoding writes the same tokens either way.
  top_logprobs: 2

  # MUST stay raw_logprobs while structured decoding is on (arch v2.1 5.1).
  # Constrained decoding masks invalid tokens, so the post-mask distribution is
  # NOT the model's own - and a calibrator fitted on it produces a number that
  # looks like a probability, is not one, and cannot be told apart from one
  # anywhere downstream. RunnerConfig.assert_logprobs_are_the_models_own()
  # refuses the combination rather than trusting this comment.
  logprobs_mode: "raw_logprobs"

  # Structured decoding against the Fideon SPEC_00 target schema (arch v2.1 13).
  # Guarantees structural validity and stops an enum field - doc type, ACORD
  # form, line of business - taking a value outside its enum, because those
  # tokens are masked at decode time rather than rejected afterwards.
  #
  # Evaluation runs BOTH constrained (what production sees) and unconstrained
  # (a training-health signal: whether the model learned the format on its own).
  structured_outputs: true

  # The same answer for the same input on every run: batch-invariant kernels
  # where this vLLM has them, and no prefix caching (RunnerConfig.repeatable).
  # Greedy decoding alone differs between runs when the batch around a request
  # changes. Off: without the prefix cache each window pays its system prompt
  # again. Turn on for a run-to-run check, and measure the cost first.
  repeatable: false

  # Rows per vLLM call when a whole split is generated (checkpoint selection,
  # calibration; evaluation.validation_generation). A call ends when its longest
  # answer does: at 32 rows about one call in four waited ~140 s on one long
  # schedule while the GPU sat nearly idle (~25% of the CGL run's selection
  # time). More rows per call, longest answer first, overlap those tails. Each
  # call opens its rows' page images first, so this also bounds host memory.
  validation_batch_rows: 96

serving:
  backend: "vllm"              # vllm | hf | gguf
  served_model_tag: null       # resolved from the registry at deploy time
  # Foundation + one per-type LoRA, swapped per request from the classifier
  # result, without reloading the base model.
  enable_lora: true
  max_loras: 4
  max_lora_rank: 64            # must be >= the Foundation rank
  gpu_memory_utilization: 0.90
  # A value whose tokens came this close (in nats, logprob of the token written
  # minus the best other token's) to another token is flagged <path>:near_tie
  # and sent to review: greedy decoding with repeatable: false can write the
  # other one on another run, when the batch around the request differs.
  near_tie_margin: 0.1
  # A stock `vllm serve` takes every sampling setting a request leaves out from
  # the model's generation_config.json. The requests pin them
  # (inference_core.model_runner.PINNED_SAMPLING: repetition_penalty 1.0,
  # top_k -1, presence and frequency penalty 0), and the server is started with
  # `--generation-config vllm` as well, so nothing the model ships decides them.
  # Its other flags: --logprobs-mode raw_logprobs, --structured-outputs-config
  # '{"backend": "xgrammar", "disable_any_whitespace": true}' and
  # --max-model-len at least sequence.max_seq_len above.

routing:
  # Below this, do NOT guess an adapter. Fall back to Foundation-only extraction
  # with a generic prompt and flag for human routing review: a wrong-adapter
  # extraction is worse than a slightly-generic one (arch 4a).
  classifier_confidence_threshold: 0.70
  fallback: "foundation_only"

  # With detect_lob on, a policy that arrives with no line of business (a scan
  # L1/L2 could not read) has its line read by the classifier, with the line's
  # own token probability as its confidence. At or above
  # lob_confidence_threshold it routes as the caller's line would; at or above
  # lob_uncertain_threshold it is read with that line's schema, flagged
  # lob:uncertain for a person to check; below, the base model reads it against
  # the fallback schema, flagged lob:undetected.
  #
  # Off until it has been measured: a confident wrong line routes to the wrong
  # adapter and schema with no flag. Turn it on after
  # scripts/measure_lob_detection.py has been run on held-out policies (scanned
  # documents and held-out carriers reported apart), both thresholds fitted from
  # its sweep, and every line has cleared its floor. Off, a policy with no line
  # is refused, or read against the fallback when the caller sends
  # allow_lob_fallback. On, the endpoint builds the classifier at cold start:
  # the base model with no adapter (serving.vllm_entrypoint.line_classifier),
  # which needs the releases served as LoRAs on the base - an engine holding
  # one release's merged model reads no line.
  detect_lob: false
  lob_confidence_threshold: 0.90
  lob_uncertain_threshold: 0.60

  # Adapter paths are resolved through the registry, never hardcoded here. The
  # three keys that used to sit here were a second, silent source of truth about
  # which document types exist - a type added anywhere else was simply absent
  # from serving, with no error.

  # The tenant's promoted release serves (serving.release_router): `package`
  # promotes each version that passes its gate, and a rollback is
  # `python -m orchestration.run promote --version vK`.


confidence:
  # Fields below this calibrated confidence route to human review (arch 5).
  # Tunable - a starting point, not a settled threshold.
  review_threshold: 0.70
  # Default span aggregation: minimum token probability is most sensitive to the
  # weakest link, which is what you want when flagging risky fields.
  aggregation: "min"           # min | mean | geomean

printed_values:
  # A served policy holds no value its PDF does not print (decision 2026-10-24).
  # Every value the model wrote is looked up on the pages' text, forgiving OCR's
  # misreads, on scans too (common.grounding.ground_tolerant). strict: one no page
  # prints is taken out of the JSON - its key stays, null - and flagged
  # <path>:not_printed_removed. flag: it is kept and flagged <path>:not_printed.
  # serving.printed_values; any other value is refused.
  mode: strict

fields_first:
  # Pages MinerU reads before the fields are served (serving.fields_first.
  # pages_to_verify): chosen so that as many values as possible have a page they
  # cite among them (a set cover), at most this many. A value none of them
  # covers is held back as pending_full_text and settled when the full text
  # arrives, never served unchecked. Why a budget: the labels cite every page
  # that prints a value, so a carrier name in every header cites every page, and
  # the cited pages of a long policy are most of it (80% on the first base-model
  # baseline; a 250-page policy needed ~140 pages to cover every value). MinerU
  # reads ~1.3 s a page, so 40 pages is ~52 s of the gate's 2 minutes - an
  # unmeasured fit with the model's time, to be set from the shadow check.
  # 0: no budget (every cited page, as before).
  verify_page_budget: 40

long_documents:
  # Every page of a document is read, chunk by chunk, never selected pages
  # (decision 2026-10-19): a long policy in windows planned by the same
  # function the corpus build used (policy_windows.plan_windows), so nothing
  # here changes the window plan. When the same field appears on several pages,
  # the declarations page wins for policy-level fields.
  conflict_resolution: "declarations_page_wins"
