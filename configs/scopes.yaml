# Training scopes (arch v2.1 §4.1, §4.2) - WHAT one run covers.
#
# A scope is the answer to "which adapter am I training?". Each one is an
# INDEPENDENT LoRA on the bf16 base, with its own run id, checkpoints, merge,
# quantization, calibration, gate, release bundle and metrics. Scopes are never
# stacked: vLLM applies one LoRA per request, which is the same constraint that
# killed v1's Foundation-plus-per-type topology.
#
# Training one, another, or several is `--scope NAME` (repeatable), never a code
# change:
#
#   python -m orchestration.run all --scope unified --out-version v2 ...
#   python -m orchestration.run all --scope policy  --out-version v2 ...
#   python -m orchestration.run all --scope unified --scope policy ...
#
# WHAT EACH FIELD MEANS
#
#   lineage      the run-id prefix. `unified` keeps `extractor` so every artifact
#                already in Blob (extractor-v1, extractor-v2) stays addressable.
#   doc_types    the types this run TRAINS. Narrower than ACTIVE_DOC_TYPES is the
#                point; wider is refused.
#   tasks        the tasks its corpus rows carry. Decides the run's max_length,
#                and which gating metrics are structurally not applicable.
#   serves       the types a release from this scope may serve. Defaults to
#                doc_types. Serving routes each type to the narrowest promoted
#                release that covers it.
#   floors       per-scope overrides on the §0d promotion floors.
#   not_applicable_metrics
#                metrics this scope cannot produce. Checked against what the
#                scope's SHAPE implies - declaring more is refused at load, so
#                this cannot become a way to waive a gate by configuration.
#
# `classify` stays in EVERY scope's task set, including single-type ones: a
# policy-only release still has to recognise an ACORD and refuse it, so the
# classifier floor keeps meaning something.

default_scope: unified

scopes:

  # The v2.1 topology: one adapter over every document type and task.
  unified:
    lineage: extractor
    doc_types: [acord, policy, lossrun]
    tasks: [classify, extract,
            lossrun_header, lossrun_rows, lossrun_totals,
            policy_declarations, policy_schedule, policy_endorsements]
    training_config: unified

  # Policy only. Everything else is paused, not deleted: the unified scope above
  # is unchanged and can be trained again by naming it.
  #
  # Loss Run reconciliation is not applicable here because no Loss Run is in the
  # corpus - there is nothing to reconcile, which is a statement about the eval
  # set rather than a pass.
  policy:
    lineage: policy
    doc_types: [policy]
    # The policy decomposition (7b): a 60-page policy is read as declarations,
    # schedule windows and endorsement passes. The one-call `extract` stays for
    # short policies.
    tasks: [classify, extract,
            policy_declarations, policy_schedule, policy_endorsements]
    training_config: unified
    not_applicable_metrics: [lossrun_totals_reconciliation_rate, table_f1]

  # Declared now so the shape is settled before it is needed.
  lossrun:
    lineage: lossrun
    doc_types: [lossrun]
    tasks: [classify, extract, lossrun_header, lossrun_rows, lossrun_totals]
    training_config: unified

  # Personal lines (the LOB enum's personal lines; flood is NOT in this
  # adapter - a flood policy is outside the scope and refused): a policy-only
  # scope narrowed by line of business. Its corpus view, validation, golden eval
  # and serving all keep to these lines; a policy of any other line - or with no
  # recorded line - is refused by its release rather than extracted by a model
  # that never trained on it. A package policy mixing a personal and a commercial
  # line is outside the scope.
  personal_lines:
    lineage: personal_lines
    doc_types: [policy]
    # Classic auto is personal auto (common.lob.MERGED_LINES), not a line of its own.
    lines: [homeowners, personal_auto, dwelling_fire, ocean_marine,
            motorcycle, recreational_vehicle, personal_umbrella]
    # classify stays, as in every scope: a personal-lines release must still
    # recognise a non-policy document and refuse it.
    tasks: [classify, extract, policy_declarations, policy_schedule, policy_endorsements]
    # unified.yaml plus this adapter's per-line data mix (Fideon SPEC_09
    # amendment items 6 and 7).
    training_config: personal_lines
    not_applicable_metrics: [lossrun_totals_reconciliation_rate, table_f1]

  # Casualty and fleet (configs/layout_families.yaml): the family's adapter,
  # trained for now on commercial general liability alone - its own tenant, from
  # the CGL source documents. Its lines are what it trained on, because serving
  # routes by them: auto, wc and umbrella join once they are on the common model
  # and in the corpus. Listed before then, their policies would reach an adapter
  # that never saw their layouts and was trained on another output shape.
  casualty_fleet:
    lineage: casualty_fleet
    doc_types: [policy]
    lines: [gl]
    tasks: [classify, extract, policy_declarations, policy_schedule, policy_endorsements]
    # No per-line data mix: one line, no synthetic copies.
    training_config: unified
    not_applicable_metrics: [lossrun_totals_reconciliation_rate, table_f1]
