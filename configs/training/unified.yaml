# The unified extractor LoRA (arch v2.1 §4.1, §9.4, §11.1).
#
# ONE adapter, trained on ALL document types and ALL tasks together. The task,
# document type and schema are always in the prompt, so the model is never
# guessing which output to produce, and cross-type interference is controlled by
# conditioning rather than by separate weights.
#
# WHY NOT v1's Foundation + per-type stack: vLLM applies ONE LoRA per request,
# so a Foundation LoRA and a per-type LoRA cannot both be active. The v1 topology
# was unservable - not slow, not awkward, unservable. A merged unified model has
# no such limit.
#
# It also fits the data. At 25-30 documents per type, separate per-type adapters
# would memorise their own training documents; the shared skills - insurance
# terminology, table and checkbox reading, image-over-OCR arbitration, JSON
# discipline - are learned once here instead of three times badly.
#
# Per-type adapters return only through the §4.2 graduation gate: >= 500 labeled
# documents of that type AND a measured >2pp win outside the paired-bootstrap
# 95% CI. Even then they train on the MERGED foundation, decoder-only, one LoRA
# per request - never stacked. No per-type training config exists until a type
# graduates; IMPL-06 §4 describes what one must satisfy.

run_type: unified

lora:
  rank: 64
  alpha: 128

  # 0.10 at pilot scale, 0.05 at >= 200 documents per type. A rank-64 adapter on
  # ~25 documents per type will memorise them at 0.05; the higher rate is the
  # cheapest regularisation available and costs nothing once data arrives.
  #
  # auto (training.train.resolve_lora_dropout) applies that rule: a run from
  # the base takes 0.05 when every line it trains has >= 200 REAL (not
  # synthetic) training documents, else 0.10; a continued run keeps its parent
  # adapter's value (ms-swift trains a continued adapter with its own saved
  # dropout anyway), so auto never stops a cycle continuing. The value chosen
  # and why are on the run manifest (training_config.lora_dropout,
  # lora_dropout_choice) and in the adapter's adapter_config.json. A number
  # here is used as it is, and a continued run whose adapter was saved with
  # another number is refused (by hand) or starts from the base (pipeline).
  dropout: auto
  bias: "none"

  # Attention and MLP projections in every LANGUAGE-MODEL decoder layer. The
  # mergers are NOT targeted (arch v2.1 §9a) - a reversal of v1, which appended
  # "merger" to this list.
  #
  # Two reasons. Tower and connector LoRA in vLLM is experimental with known
  # mixed-adapter batching risks, so an adapter targeting them may not serve the
  # way it trained. And image-vs-OCR arbitration is learned HERE, in the decoder,
  # where image tokens and OCR text tokens attend to each other - the mergers only
  # map visual features and never see OCR text at all.
  #
  # Vision-module LoRA is ablation-driven (§9a) and, if it ever runs, is merged
  # into the base rather than hot-swapped.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  include_vision_projector: false

  # Off by default; on for the rank sweep only (§11a), so the learning rate
  # transfers across ranks instead of needing a re-sweep at every rank.
  use_rslora: false

optimization:
  # 1e-4 at both scales. v1 ran the Foundation at 2e-4, which is aggressive for
  # ~25 documents per type and a rank-64 adapter.
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"

  # Steps, not a ratio. At pilot volume a 0.03 ratio over a handful of steps
  # rounds to zero warmup, and the first optimizer step lands at full learning
  # rate on a freshly-initialised adapter.
  warmup_steps: 10

  # DOCUMENT passes (arch v2.1 §6.1). Each document appears once per epoch with
  # its modality regime resampled, so 3 here is 3 passes - not the 9 that v1's
  # three-rows-per-document expansion produced under the same number.
  num_train_epochs: 3

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

  # 0.0, not 0.01. Weight decay on a low-rank adapter pulls B toward zero, which
  # is where it starts - so it is a shrinkage prior on the update itself, not the
  # regularisation it is on a full fine-tune. Dropout does that job here.
  weight_decay: 0.0
  max_grad_norm: 1.0

# A cycle that continues the promoted adapter (decision 2026-10-23) trains with
# these instead of the optimization values above; null keeps the value above.
# Its documents already trained in the cycles before, so fewer passes or a lower
# rate may be enough: set them from a measured continued run, not by guess.
#
# The A/B to run on the FIRST continued cycle, before setting either: on the
# same corpus, (A) a fresh run (--fresh, 3 epochs at 1e-4) and (B) a continued
# run with num_train_epochs: 1 and learning_rate: 5.0e-5 (write 5.0e-5: YAML
# reads 5e-5 as text). Compare them on checkpoint selection's validation scores
# (field and document accuracy, invented values, run-to-run agreement) and on
# the gate (golden eval, line by line). Keep B's values here only if B is no
# worse on both; record the comparison with the decision.
#
#   rehearsal_old_share   null (default): a continued run trains every document
#       in every epoch, as a fresh run does. A share (0 < share <= 1, e.g. 0.4):
#       each epoch trains every NEW document - one the continued chain of runs
#       never trained on - and that share of the OLD ones, per line (at least
#       one per line), spread evenly over each line's carriers, seeded, and
#       rotated so the next epoch takes the next ones: every old document trains
#       within ceil(1 / share) epochs. A fresh run ignores it. Which documents
#       were new and which were rehearsed in each epoch is on the run manifest
#       (data_stats.data_mix.rehearsal). Test it with the A/B above: same corpus,
#       continued with and without it.
#   rehearsal_weight_by_line_errors   false (default): every line rehearses the
#       share above. true: a line's share is scaled by its error rate on the
#       parent run's validation errors over the old documents' mean (at most
#       1), so the lines the parent got wrong rehearse more. Needs the parent's
#       validation-errors record; without one the plain share applies (the
#       manifest says why).
continued_training:
  num_train_epochs: null
  learning_rate: null
  rehearsal_old_share: null
  rehearsal_weight_by_line_errors: false

batch:
  per_device_train_batch_size: 1

  # 8 at pilot (was 32). With ~25 documents per type an effective batch of 32 is
  # most of an epoch in one step, so a run sees a handful of updates and the
  # cosine schedule never gets anywhere.
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  gradient_checkpointing: true
  bf16: true

  # Processes for ms-swift's dataset preprocessing. Capped at the pod's CPU count
  # at launch. (With length_grouped_sampling on, ms-swift also encoded every row
  # up front to learn its length - ~1 row/s on the CGL full run, 1.5 h before
  # step 1 - which is why that is off below.)
  dataset_num_proc: 8

  # Throughput levers. null = not passed to ms-swift, its own default (what
  # every run so far trained with). None changes what is learned, only how
  # fast, so none is in the run fingerprint and a run may resume with another.
  #
  #   vit_gradient_checkpointing  null = ms-swift follows gradient_checkpointing
  #       (on). The vision tower is frozen, so recomputing its activations buys
  #       little memory; false may save 5-10% per step.
  #   dataloader_num_workers      null = ms-swift's default. Rows are decoded
  #       and their page images loaded in the training process without
  #       workers; 4-8 may hide that behind the GPU.
  #   per_device_eval_batch_size  null = the trainer's default. The in-training
  #       loss checks only; with padding_free, 4 is suggested.
  #
  # Measure before setting any, ONE lever at a time, each against the run
  # before it (python -m training.train --corpus <v> --out-version <v>
  # --benchmark-steps 30 writes benchmark.json: step time median and p90,
  # tokens/s, peak memory, and suggests the next lever):
  #   1. vit_gradient_checkpointing: false
  #   2. per_device_train_batch_size: 2 - accumulation halves on its own
  #      (effective_batch_size stays 8), if peak memory leaves room
  #   3. dataloader_num_workers: 4, then 8
  # Keep a lever only if the median step time falls by more than the p90-median
  # spread, and peak memory stays under ~90% of the card.
  vit_gradient_checkpointing: null
  dataloader_num_workers: null
  per_device_eval_batch_size: null

memory:
  # Logits for the assistant positions only, instead of a 151k-vocabulary
  # distribution over every position in a 32k sequence. At the largest task cap
  # this is the difference between fitting on one 80GB card and not (§9.3).
  use_logits_to_keep: true

  # No memory spent on padding: rows are concatenated, never padded, so a 4k
  # classify example is not padded to a 32k policy extraction.
  padding_free: true
  # Off. Grouping rows of similar length only saves padding, and with one row
  # per device and padding_free there is none to save - while it made ms-swift
  # encode every row before step 1 to learn its length (1.5 h on the CGL full
  # run, 13 min on 1,185 rows). Off, the same rows are visited in a plain random
  # order: same data, same steps.
  length_grouped_sampling: false

evaluation:
  # Validation LOSS during training - field F1 needs generation, which the
  # training loop's eval does not do efficiently for a VLM. Checkpoint selection
  # is a separate vLLM job that generates on validation (§11.2), so loss here is
  # for early stopping only and never selects what ships.
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50

  # The last 3 checkpoints plus the best-loss one are what checkpoint_eval
  # generates over, so fewer than 4 would discard a candidate before it is scored.
  # Counted in EVALUATION checkpoints: with resume checkpoints saved between
  # evaluations, the trainer keeps enough of them that these 4 survive.
  # The checkpoint nearest two-thirds of the run is kept as well, whatever
  # this says: the limit is raised until rotation cannot reach it
  # (training.train.keep_two_thirds_limit), and its step is recorded in the
  # run's training_complete.json (two_thirds_step) for checkpoint selection.
  save_total_limit: 4

  # A resume point at least this often (~1 h on one H200 at the measured 51 s per
  # step), so a crash costs at most about an hour of training, not the run. An
  # evaluation still falls on every n-th of these. Each checkpoint carries the
  # optimizer state a resume needs (~1.8 GB for a rank-64 adapter).
  checkpoint_every_steps: 70

  # Off: what ships is chosen by generated field F1 over the saved checkpoints
  # (checkpoint_eval), never the weights loss liked best, so loading them at the
  # end changed nothing that ships. On, the trainer refuses to save between
  # evaluations, and resume points could be no closer than the evaluations.
  load_best_model_at_end: false

  # The validation cut. In-training checks per run, each on a fixed stratified
  # sample of the validation split (evaluation.validation_sample); checkpoint
  # selection ranks its candidates on a larger one. On the delivered corpus,
  # every 50 steps on all ~3,300 rows cost 50-60 h of a ~35 h training run.
  evaluations_per_run: 10
  validation_sample_rows: 400
  # The in-training checks' own sample (training.train.loss_sample_rows). Their
  # loss only draws the progress curve: no early stopping, best-loss weights
  # never loaded. 160 rows instead of 400: ~3 min per check instead of ~7.4.
  loss_sample_rows: 160
  # How both samples are drawn (evaluation.validation_sample.sample_options).
  # All off by default: line x mode strata, each in proportion to the split.
  # Each changes which rows are chosen, so the in-training checks and checkpoint
  # selection, which read the same config, change together.
  #   validation_sample_by_empty_target  true: stratified by whether a row's
  #       target states anything, too, so windows whose answer is empty are
  #       sampled in their share.
  #   validation_rows_per_family_max  a number: at most that many rows of one
  #       family (a seed and its twins; a policy's windows in every mode), so one
  #       long policy does not fill the sample. null: no cap.
  #   validation_sample_mode_shares  null: each mode in its share of the split (a
  #       third each). `training`: the training mix (modality_mix) - under the
  #       fast profile image_only 0.7, the mode production reads; set it under
  #       format_profiles.fast.evaluation to leave standard as it is. Or a
  #       mapping, e.g. {ocr_plus_image: 0.25, noisy_ocr_image: 0.05,
  #       image_only: 0.7}. A mode with no rows gives its share to the others.
  validation_sample_by_empty_target: false
  validation_rows_per_family_max: null
  validation_sample_mode_shares: null
  # When the top two candidates are closer than this in field accuracy on the
  # sample, those two are scored again on the full validation split, which
  # decides. Sample noise only matters inside such a margin.
  selection_tie_break_margin: 0.015
  # The best candidates on the sample are then scored on every validation row
  # and judged on whole documents - windows merged as serving merges them: of
  # the finalists whose field match is within the guard margin of the best
  # one's, and whose rate of printed values left empty is within it of the
  # best finalist's, the one inventing the fewest values wins (decision
  # 2026-10-24). Field match there is the gate mirror (gate_mirror_accuracy):
  # image_only readings of real documents, whole, held to their page text
  # borrowed from ocr_plus_image as serving holds them - what the gate
  # measures; with no such document read, document accuracy over every mode
  # stands in, and the selection record says so. 0 or 1: the sample decides
  # (with the near-tie rule above).
  # Costs one full validation pass per finalist, sharded across every GPU of
  # a multi-GPU pod (two finalists on four GPUs keep all four busy).
  # 2, not 3: on the CGL run each finalist pass was ~6,170 rows (~1 h 55 min on
  # one H200), and the third finalist never won (replayed with 2, it still
  # selects checkpoint-734).
  selection_document_finalists: 2
  # The reading modes that whole-document pass (and a near-tie) reads; empty =
  # all three. The main mode only: a third of the rows. The sample above still
  # ranks every candidate in all three modes, and the golden gate scores all three.
  selection_document_modes: [ocr_plus_image]
  selection_guard_margin: 0.02
  # Run-to-run agreement (decision 2026-10-24): the same document must read the
  # same twice. The finalists' whole-document pass is generated a second time,
  # its rows in the reverse order, and a finalist whose agreement between the
  # two is more than the guard margin below the best finalist's does not win.
  # Only the rows in run_to_run_mode (below: image_only, the gate's own repeat)
  # are read twice; a pass that does not read that mode reads all its rows
  # twice. Costs that mode's rows once more per finalist.
  selection_run_to_run_check: true
  # The checkpoint nearest two-thirds of the final step is a candidate too,
  # when it is on disk and not one already. Whether it won or tied is in the
  # selection record and summary: the evidence for training two epochs.
  selection_two_thirds_candidate: true
  # Calibration fits from the selected finalist's own answers to its
  # whole-document pass (saved in the run's working dir and in Blob beside the
  # run's artifacts), generating only the rows they do not cover (the other
  # modes) - when they were made by the checkpoint calibrated, in bf16, with
  # the generation settings calibration uses; otherwise it generates the split
  # itself. Its stage result records which.
  calibration_reuses_selection: true
  # The golden eval reads every document a second time in run_to_run_mode, its
  # windows sent in reverse order, and the gate holds the release to
  # run_to_run_agreement (evaluation.golden_eval). Costs one more pass in that
  # mode over the frozen set.
  run_to_run_check: true
  # The mode of that second reading: image_only, the mode production reads
  # (fields first: the page images alone, the fields then checked on MinerU's
  # text) - decision 2026-10-26; ocr_plus_image before it. One of
  # ocr_plus_image, noisy_ocr_image, image_only. Recorded in the eval report
  # (run_to_run_mode, and eval_set) and part of its yardstick: it is folded
  # into the scoring fingerprint, so a report made on another repeat mode is
  # neither reused for the gate nor compared with one made on this mode.
  run_to_run_mode: image_only
  # The share of the frozen set that second reading covers: a deterministic
  # subset (a hash of each source id), 1.0 = every document, as before. Below
  # 1.0 it saves part of that pass, and run_to_run_agreement is over fewer
  # documents. Part of the yardstick, like the mode.
  run_to_run_share: 1.0
  # The share of the frozen set the golden eval reads in noisy_ocr_image, a
  # deterministic subset like the one above; 1.0 = every document, as today.
  # The gate still averages the same modes; below 1.0 ocr_arbitration_accuracy
  # is over fewer documents. Part of the yardstick.
  golden_noisy_share: 1.0
  # Golden-eval readings sent at once, on a backend that answers requests as
  # they finish (a served vLLM); the in-process engine reads one document at
  # a time, its windows batched. Results are put back in order.
  golden_documents_in_flight: 4
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  # No early stopping: ms-swift 3 takes no patience argument, and stopping
  # would only remove candidates from checkpoint selection, which chooses by
  # generated accuracy. (early_stopping_patience was here, read by nothing.)

logging:
  logging_steps: 10
  report_to: []

seed: 42

# Lines of business with few training documents are repeated in every epoch
# file, so the largest line (homeowners: 593 of 1,329 training documents) does
# not decide what the model learns for the small ones (motorcycle 33, ocean
# marine 44, umbrella 55). A line under min_documents is repeated
# ceil(min_documents / its documents) times, at most max_repeat. Validation and
# test are never repeated. 0 turns it off.
#
#   count  what a line's size is counted in. documents (default): every
#       document, each render of each twin included - so a line of 5 seeds
#       with 20 twins each counts 100 and is never raised, though it holds 5
#       policies' worth of layouts. families: a seed and its twins count once
#       (every real family once). real: real documents only.
#   distinct_repeats  false (default): a repeated line's rows are written again,
#       byte for byte. true: each repeat comes from the NEXT epoch file of the
#       corpus (the fourth too, which a three-epoch run otherwise never reads),
#       so it has its own mode draw and windows.
#
# OFF since 2026-10-27 (user decision, first commercial cycle): each line trains
# at its natural share. Raising its small lines (boppr, wc, bopgl) to the
# largest (gl) repeated their few documents three times an epoch and nearly
# doubled the run (~30 h against ~16 h). 100 turns it back on.
line_balance:
  min_documents: 0
  max_repeat: 3
  count: documents
  distinct_repeats: false

# One render per twin per epoch (training.corpus_view.plan_render_rotation). A
# twin's digital and scanned PDFs share one gold, so training both in an epoch
# repeats its answer: rotated, each twin trains in one render, the other the
# next epoch - every twin every epoch and both renders over the run, in about
# 60% of the documents. Each epoch stays about half digital, half scanned. Real
# documents always train; a line rotation would take under line_balance's floor
# keeps both renders. Validation and test keep every render. Applied in the
# adapter's view of the corpus (training.corpus_view), as line_balance is.
# false trains both renders every epoch.
render_rotation: true

# Per line of business: which share of the line's TRAIN documents is synthetic,
# and which share is scanned (Fideon SPEC_09 amendment items 6 and 7).
# training.data_mix applies them in the adapter's view of the corpus. Every real
# document always trains; the view picks the synthetic ones, one twin of every
# seed before a second of any. Validation and test are never sampled.
#
#   synthetic_fraction  synthetic / train documents of the line. 0.8 with 12
#                       real documents keeps 48 synthetic ones.
#   scanned_share       scanned / train documents of the line: the share of
#                       scanned policies the line sees in production.
#
# The two values below are the defaults; null leaves the share unsteered (every
# synthetic document trains). A line's own value, under `lines:`, overrides the
# default, e.g.  lines: {homeowners: {scanned_share: 0.4}}
#
# Both are null until set: every document trains. The values used, and what
# each line came to, are recorded on the run manifest (data_stats.data_mix) and
# in the run's model card. scanned_share stays null until it is measured: set it
# to the scanned share of the policies production actually receives (per line
# where they differ), from production's own intake, not a guess.
#
#   twins_per_seed_per_epoch  null (default): every twin the shares keep trains
#       in every epoch - the same twins each time. A number k: each epoch trains
#       k twins of every seed (a twin with two renders is one twin; render
#       rotation still picks the render), the next k the next epoch, seeded, so
#       a seed's twins are all seen within ceil(twins / k) epochs. Real
#       documents train every epoch. Recorded on the run manifest
#       (data_stats.data_mix.twin_rotation).
data_mix:
  synthetic_fraction: null
  scanned_share: null
  twins_per_seed_per_epoch: null

# Hard examples (training.corpus_view.hard_fields): repeat the train windows
# whose targets hold a field the last model got most wrong on validation.
# Read from the validation errors checkpoint selection records for the winning
# checkpoint (artifact_registry.paths.validation_errors_key): the parent run's
# for a continued run, else the promoted release's run. A field's error rate is
# (wrong + missed + invented) / values.
#
#   top_fields  null (default): off. A number n: the n fields with the highest
#       error rate among those with at least min_values gold values.
#   max_repeat  a hard window appears up to this many times in its epoch
#       (line balance's copies aside): its max_repeat - 1 extra copies come from
#       the next epoch files - the same document's windows holding the field, in
#       their own mode draw - so no extra copy is the same row again.
#   min_values  a field with fewer gold values on validation is not ranked: its
#       rate is noise.
#
# With no record to read (a first run, a run older than the record), nothing is
# repeated and the run manifest says why (data_stats.data_mix.hard_examples).
hard_examples:
  top_fields: null
  max_repeat: 2
  min_values: 30

# The input-mode mix is common.constants.MODALITY_MIX (50% OCR text and images,
# 20% corrupted OCR and images, 30% images only: the standard profile) unless
# set here or by the active format profile. The fast profile, shipped since
# 2026-10-26, sets 25% / 5% / 70% images only (format_profiles.fast below):
#
#   modality_mix: {ocr_plus_image: 0.5, noisy_ocr_image: 0.2, image_only: 0.3}
#
# Modes are drawn when the corpus is built, so a run on a corpus drawn with
# another mix is refused.

# What changes under a format profile (configs/shared/format.yaml): the active
# profile's keys are laid over this config (common.config.training_config);
# under `standard` nothing here applies.
format_profiles:
  fast:
    # Mostly image-only reading (user decision 2026-10-26). Production serves
    # fields first: every field served comes from an image_only read, so that
    # is the mode the model is trained for. ocr_plus_image keeps a quarter: the
    # standard path (short documents, a fallback) and the page text the
    # selection borrows to count image_only inventions. noisy_ocr_image only
    # protects the OCR paths, so it keeps a token share.
    #   standard  0.5  / 0.2  / 0.3
    #   fast      0.25 / 0.05 / 0.7
    # Check before the corpus build: if image_only reads the pod run's scans
    # more than ~2-3 points below ocr_plus_image, go back to 0.4 / 0.1 / 0.5
    # and reconsider fields first.
    modality_mix: {ocr_plus_image: 0.25, noisy_ocr_image: 0.05, image_only: 0.7}
    evaluation:
      # The finalists' whole-document pass reads image_only too: most of the
      # train rows are in it, and a checkpoint is chosen on what it trains for.
      # Its image_only answers are held to the fewest-invented-values rule on
      # the page text of the same documents' ocr_plus_image rows, which this
      # pass also reads (decision 2026-10-26); keep ocr_plus_image here, or
      # those answers go unscored.
      selection_document_modes: [ocr_plus_image, image_only]


distributed:
  # One H200 SXM 141GB in this deployment (sized originally for an A100 80GB). If a task cap does not fit, ms-swift SEQUENCE
  # PARALLELISM comes first (§9.3) - DeepSpeed ZeRO is not used unless that is
  # exhausted too, because under LoRA ZeRO-2 shards ~1.5GB of adapter optimizer
  # state and is close to a no-op.
  deepspeed_config: null
  sequence_parallel_size: 1

  # GPUs to train on, data-parallel: "auto" = every GPU the pod has, or a
  # number. Each takes whole rows; gradient accumulation shrinks so the
  # EFFECTIVE batch (batch.effective_batch_size) is unchanged - the same steps,
  # learning-rate schedule and result as on one GPU, each step ~n x faster.
  gpus: auto
