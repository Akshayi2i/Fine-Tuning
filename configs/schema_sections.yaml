# Which canonical sections one extraction call asks for, and over which pages.
#
# WHY THIS EXISTS. A canonical policy schema is 27,000-42,000 characters, and the
# whole of it goes into the prompt. That leaves room for four to six pages of a
# document, so a 200-page policy cannot be read in one call - and a call that
# carries the whole schema is asking for the whole document shape from pages that
# hold a fraction of it.
#
# Slicing pays for itself. Measured, against the same budget:
#
#     whole schema     4-6 pages per call
#     decl             7 pages    (3,246 tokens - IDENTICAL for all 33 lines)
#     arrays           8 pages    (1,438 tokens - IDENTICAL for all 33 lines)
#     lineblk          7-8 pages  (752-3,887)
#     dtd              7 pages    (4,931, and only three lines carry it)
#
# THE CROSS PRODUCT, AND WHY IT IS NOT CHEAPER TO GUESS. A window is a (group,
# page window) pair, and every group is asked over every page that could carry
# it. The tempting alternative - work out which section each page holds, and ask
# only for that - needs a page->section map, which comes either from gold
# (training only) or from a classifier (serving). Either way a mislabelled page
# means a section that is never asked for on the page that had it, and the field
# comes back null with nothing to say why - the same silent miss page selection
# had, which is why every group now reads every page (decision 2026-10-19).
#
# ONE MAP, EVERY LINE. Sixteen top-level sections appear in all 33 canonical
# schemas, byte-identical, and they are over half of every prompt. So `decl` and
# `arrays` are written once here rather than 33 times, and `lineblk` is defined
# as the remainder - which is what makes a line this repo has never seen still
# get every one of its sections asked for.

groups:

  decl:
    title: Declarations
    task: policy_declarations
    pages: declarations
    # Every page, with pages 1-5 and the detected declarations page read
    # together in the first window. The policy-level objects. These are the fields whose value is the
    # document's, not a row's, and `policy.jinja` tells the model that where a
    # schedule or an endorsement repeats one of them differently, the
    # declarations value wins. That rule only holds if this group is the one
    # reading the page the declarations are printed on.
    sections:
      - document
      - carrier
      - producer
      - policy
      - named_insured
      - premium
      - terrorism
      - billing
      - claim_reporting
      - signature

  arrays:
    title: Schedules
    task: policy_schedule
    pages: every
    # The repeating tables shared by every line. Asked over every page,
    # because a location schedule can be printed anywhere in a 200-page policy
    # and guessing where costs a whole table.
    sections:
      - locations
      - interested_parties
      - forms_and_endorsements
      - deductibles
      - loss_history
      - state_notices

  lineblk:
    title: Line-specific coverages
    task: policy_schedule
    pages: every
    # Defined as "every top-level section no other group claims", so a line with
    # sections this file has never heard of - `covered_classes`,
    # `business_liability_coverage_part` - still has them asked for. Naming them
    # instead would mean the first unlisted section was silently dropped.
    sections: remainder

  dtd:
    title: Document type detail
    task: policy_endorsements
    pages: declarations
    # What KIND of policy document this is - declarations, renewal offer,
    # cancellation, endorsement. That is stated near the front, with the
    # declarations, which is why its first window is theirs; it reads every
    # page after it. Only a few self-contained lines carry it.
    sections:
      - document_type_detail

# --------------------------------------------------------------------------
# Page rules
# --------------------------------------------------------------------------
#
# Every group reads EVERY page, chunk by chunk, never selected pages
# (decision 2026-10-19). The rule says only how the first window is formed:
#
# `every`        the pages are packed into windows by runs.
# `declarations` pages 1-N, PLUS the page the declarations were detected on when
#                it falls outside them, are read together in the first window;
#                the rest follow as for `every`.
#
# That second clause is not defensive padding. Scanned intake routinely opens
# with a fax cover sheet, a billing notice or a broker letter, which puts the
# real declarations on page 4 or 5. Pinning this group to pages 1-3 would mean
# nothing asks for the policy-level fields on exactly the documents most likely
# to be messy, and every one of them would come back null.
#
# 5, not 3 (2026-10-07): on the SPEC_21 set the declarations' own sections -
# billing installments, the carrier's address, premium items, the insured -
# are printed on pages 4 and 5 often enough that 2,842 values sat on pages no
# window of their group read. Five leading pages, plus a declarations page found
# later, is six: one declarations window still holds them, and its answer stays
# far below its reservation (largest 1,627 of 4,096 tokens).
pages:
  declarations_leading: 5

# --------------------------------------------------------------------------
# Identifying keys, for de-duplicating a row that two windows both returned
# --------------------------------------------------------------------------
#
# An array is asked over several page windows, so a table spanning a window
# boundary legitimately comes back twice. De-duplication is load-bearing here,
# not tidying. Keys are compared on NORMALISED values - case, spacing and
# punctuation - so " TOLEDO " and "Toledo" match. A prefix such as "LOC 1" vs "1"
# is NOT stripped: doing so would also merge "LOC 1" with "BLDG 1".
array_keys:
  locations: [location_number, address]
  interested_parties: [name, party_type]
  forms_and_endorsements: [form_number, edition_date]
  deductibles: [applies_to, deductible_type]
  loss_history: [claim_number, loss_date]
  state_notices: [state, notice_title]

# --------------------------------------------------------------------------
# The common-model lines (SPEC_21 overlays on common_model.json)
# --------------------------------------------------------------------------
#
# A line whose schema composes the common model (common.schemas.is_common_model)
# is read with this profile instead of the map above, which stays exactly as it
# is for the self-contained lines. Group names, tasks and page rules are the
# ones declared above: only the sections differ, so the merge's group order and
# every page rule apply unchanged.
#
# WHY THESE GROUPS. A common-model line has no line block: its blocks are shared
# tables whose rows refer to each other by id - a coverage applies to veh_2, a
# building sits at loc_1, a lienholder holds an interest in veh_1. A reference
# only means something next to the row it names, so every table that refers to
# a risk unit is read in the same group as the units: `arrays`. That is also
# where the coverage table is read, and so where a printed value with no field
# (additional_fields) is decided. The declarations keep the policy-level
# objects; the premium stays with them, so the declarations value still wins a
# conflict, and its per-unit items keep only their description and code.
common_model:
  groups:
    decl: [document, carrier, producer, named_insured, policy, lob_parts, premium, billing]
    arrays: [coverages, deductibles, interested_parties, locations, buildings, vehicles,
             drivers, watercraft, scheduled_items, rating_exposures, rating_modifiers,
             underlying_insurance, additional_fields]
    lineblk: remainder

  # Never asked for: the full-text tier is the text path's, not the model's.
  # (Every `fideon:` property is left out too.)
  exclude: [text_sections]

  # The structural id each table's rows carry, and its prefix. The model numbers
  # them from 1 in printed order; the pipeline renumbers them across windows.
  # drv, wc and item are this repository's choice until SPEC_21 names them.
  ids:
    lob_parts: {field: part_id, prefix: part}
    locations: {field: unit_id, prefix: loc}
    buildings: {field: unit_id, prefix: bldg}
    vehicles: {field: unit_id, prefix: veh}
    drivers: {field: unit_id, prefix: drv}
    watercraft: {field: unit_id, prefix: wc}
    scheduled_items: {field: unit_id, prefix: item}
    coverages: {field: coverage_id, prefix: cov}

  # Fields that hold another row's id, and the tables those ids can name. A
  # slice drops a reference field whose tables are all read by another group:
  # the window could only guess at an id it cannot see.
  references:
    applies_to: [locations, buildings, vehicles, drivers, watercraft, scheduled_items]
    location_ref: [locations]
    garaging_location_ref: [locations]
    attached_to_ref: [vehicles, watercraft]
    part: [lob_parts]

  # Identifying keys, as above. A reference field is compared after it is
  # resolved to the units' own keys (the ids differ window to window).
  array_keys:
    lob_parts: [lob]
    coverages: [coverage_code, applies_to, part]
    deductibles: [deductible_type, applies_to_coverages, applies_to]
    # A party or modifier can stand on several units, and a window that sees
    # only some of them links only those: what it links is not its identity.
    # The merge joins two such rows unless a value both state differs (one bank
    # with two loan numbers, one discount at two percents stays two rows).
    interested_parties: [role, name]
    rating_modifiers: [modifier_type, description]
    # A classification row: one class code at one location, per rating column
    # (premises-operations and products-completed operations are two rows).
    rating_exposures: [class_code, location_ref, rating_component]
    underlying_insurance: [coverage_code, policy_number]
    forms_and_endorsements: [form_number, edition_date]
    additional_fields: [label, value]

  # Pages two windows of one split page run share (policy_windows.plan_windows,
  # for training and serving alike): a row printed across their boundary - a
  # vehicle's VIN at the foot of one page, its coverages at the top of the next -
  # is then whole in one window. The windowing oracle on the bundles: links kept
  # 87.1% -> 93.6%, values kept unchanged, for 22% more windows.
  run_overlap_pages: 1

  # What identifies a risk unit across windows: the FIRST of these that a row
  # states (a list inside means those fields together). Unlike array_keys, a
  # row carrying only its VIN and a fragment carrying only its vehicle number
  # are still compared on whatever they share. A part is its line: a line read
  # by two windows (a declarations window retried in halves) is one part.
  unit_keys:
    lob_parts: [lob]
    locations: [location_number, address]
    buildings: [[location_ref, building_number]]
    vehicles: [vin, vehicle_number, [year, make, model]]
    drivers: [license_number, driver_number, name]
    watercraft: [hin, watercraft_number, [year, make, model]]
    scheduled_items: [item_number, [category, description]]
