# Schema-side map of every L1 line of business (HANDOFF item 1; project-owner decisions D-A, D-B).
#
# Keyed by the 48 `code` values of config/lob_registry.yaml, in that file's order. That L1 file stays the
# only list of LOBs and is not edited here; this map says which canonical schema each L1 code is read
# against, which adapter and layout family it uses, and which common-model blocks its schema composes.
#
# schema_lob    canonical schema id: config/canonical_schema/policy_check/<schema_lob>.json. Equals code,
#               except watercraft -> ocean_marine: watercraft is part of the ocean_marine line, not a
#               separate line (D-B: L1 detects personal boat policies as watercraft).
#               TBD where no layout family is known, so no schema is planned yet. SchemaRegistry routes
#               a code whose schema_lob differs from it to that schema.
# layout_family, adapter   SPEC_09 adapter table; SPEC_06 LOB_TO_LAYOUT_FAMILY where it names the line.
#               adapter is the one pooled policy_check_v1 for every line that has a layout family (SPEC_09
#               amendment of 15 October 2026; DECISIONS_2026-10-19 row 34); TBD where no family is known.
#               layout_family stays as a label only.
# lob_code      batch code, SYNTHETIC_DATA_PROCESS.md section 2.
# routing_key   the SPEC_06 LOB_TO_LAYOUT_FAMILY key, or null.
# blocks_used   common-model building blocks the schema composes. Envelope blocks (SPEC_21 4.2.1) are
#               used by every LOB and are not listed. From the SPEC_21 4.2.2 'Typical LOBs' column,
#               narrowed by the 4.2.5 family table.
# source_pdfs   seed PDFs for the line under synth_core/fideon/synth_core/data/source data/<Carrier>/<folder>/
#               (de-identified per SPEC_21 D2). Package folders (cgl_prop, bopgl_boppr...) are not counted.
# holdout_carrier   SPEC_21 10.3 holds one carrier per LOB out of training, so a LOB needs 2+ carriers.
#
# TBD marks a value no source gives. Every TBD is listed under open_items at the end.

