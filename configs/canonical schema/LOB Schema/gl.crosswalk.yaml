# SPEC_21 4.7 crosswalk for gl: every field of the pre-SPEC_21 gl.json 1.5.0
# (fideon.canonical.general_liability, also the fine-tuning repository's configs/canonical schema/
# LOB Schema/gl.json) and every canonical_path the line's policy registry YAMLs declare
# (config/document_registry/policy/*/gl.yaml) -> the SPEC_21 schema named by to_schema. Paths of an earlier SPEC_21
# release that a later one moved are mapped too (the 1.1.0-1.2.0 LOB block; the 2.0.0 codes and overflow labels).
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label;
# drop: not a value (needs reviewer approval). Paths already under additional_fields keep their label.
# Legacy array leaves are written with [] as the legacy schema nests them. Applied by
# tools/registry_migrate.py --lob gl.

lob: gl
from_schema: "1.5.0"
to_schema: "3.2.0"
paths:
  # gl 1.1.0-1.2.0 LOB block, removed in 2.0.0 (SPEC_21 v0.9 4.2.4); in 2.0.0 additional_fields, from 3.0.0
