  # figures are a second rating_exposures[] row of the same class_code.
  gl.products_completed_ops_rating[].rate: {new: "rating_exposures[rating_component=products_completed_operations].rate"}
  gl.products_completed_ops_rating[].premium: {new: "rating_exposures[rating_component=products_completed_operations].premium"}
