# SPEC_21 4.7 crosswalk for flood: every field of the pre-SPEC_21 flood.json (the _common-shaped envelope plus its
# flood block, $defs expanded) and every canonical_path the line's policy registry YAMLs declared
# (config/document_registry/policy/*/flood.yaml) -> the SPEC_21 schema named by to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label; drop: not a value
# (needs reviewer approval). The envelope paths take the mapping the wc, auto, homeowners and dwelling_fire
# crosswalks give them where that target is in flood.json; the flood block is mapped by hand: a coverage limit,
# deductible or premium to its FL_ coverage, the insured property to locations[] and buildings[], the mortgagees to
# interested_parties[], the premium components to premium, the flood rating facts to their captions.
# Applied by tools/registry_migrate.py --lob flood.

