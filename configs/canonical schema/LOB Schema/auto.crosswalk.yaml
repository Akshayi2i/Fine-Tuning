# SPEC_21 4.7 crosswalk for auto (commercial auto): every field of the pre-SPEC_21 auto.json 1.5.0
# (fideon.canonical.commercial_auto, generated by scripts/build_canonical_policy.py; also the fine-tuning
# repository's configs/canonical schema/LOB Schema/auto.json) and every canonical_path the line's policy registry
# YAMLs declare (config/document_registry/policy/*/auto.yaml, */autob.yaml) -> the SPEC_21 schema named by to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label;
# drop: not a value (needs reviewer approval). Paths already under additional_fields keep their label.
# The envelope fields the legacy schema shares with the legacy gl.json 1.5.0 (same generator, same template) are
# mapped as gl.crosswalk.yaml maps them. The legacy `auto` block: a scheduled auto's coverage lines
# (auto.vehicles[].coverages[]) and Item Two (auto.covered_auto_symbol_schedule[]) are coverages[] entries, the first
# with applies_to the vehicle; the liability, no-fault and physical damage blocks are limits and deductibles inside
# the coverage of that code; hired auto and non-ownership figures are a coverages[] entry plus a rating_exposures[]
# row. Legacy array leaves are written with [] as the legacy schema nests them. Applied by
# tools/registry_migrate.py --lob auto.

lob: auto
from_schema: "1.5.0"
to_schema: "2.0.0"
