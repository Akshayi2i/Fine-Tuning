# SPEC_21 4.7 crosswalk for property: every field of the pre-SPEC_21 property.json (fideon.canonical.commercial_property
# 1.5.0: the policy_core envelope plus its commercial_property block, $defs expanded) and every canonical_path the
# line's policy registry YAMLs declared (config/document_registry/policy/*/property.yaml) -> the SPEC_21 schema named
# by to_schema. new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label; drop: not
# a value (needs reviewer approval). Legacy array leaves are written with [] as the legacy schema nests them. The
# policy_core paths take the mapping boppr.crosswalk.yaml (then gl.crosswalk.yaml) gives them where that target is in
# property.json; the commercial_property block is mapped by hand: a coverage's limit to that coverage's limit under its
# PR_ code, the rest to its caption. Applied by tools/registry_migrate.py --lob property.

