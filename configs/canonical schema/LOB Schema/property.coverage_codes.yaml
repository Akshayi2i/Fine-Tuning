# SPEC_21 4.2.4 coverage codes of property (schema 2.0.0, common model 1.1.0).
# Built from the 6 native single-LOB property seed documents of 2 carriers (Leatherstocking Cooperative Insurance
# Company 5: Businessowner's Policy SF-10P x4, Commercial Fire and Liability x1; Merchants Mutual Insurance Group 1:
# businessowners declarations), read in place, and the pre-SPEC_21 property.json.
# aliases: coverage names as the seeds print them (whitespace collapsed; a wrapped name joined with one space).
# L1 codes a printed row by its name (fideon/l1/spec21.py coverage_code_for). Codes are LOB-prefixed (PR_, the
# lob_schema_map.yaml prefix); a coverage the common model shares across lines uses its X_ code; shared: true marks
# those. Liability rows printed beside the property ones are coded here under PR_ codes until shared codes exist
# (CR-PROP-02). Rows that print an exclusion or a credit against a form are not coverages: their premium is
# forms_and_endorsements[].premium.
# carriers: how many of the 2 native seed carriers print one of the code's names.
lob: property
schema_version: 2.0.0
common_model_version: 1.1.0
code_prefix: PR_
