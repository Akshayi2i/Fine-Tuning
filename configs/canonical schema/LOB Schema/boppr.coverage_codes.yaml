# SPEC_21 4.2.4 coverage codes of boppr (schema 2.3.0, common model 1.4.0).
# Built from the 5 single-LOB businessowners property seed documents of 3 carriers (Leatherstocking
# Cooperative Insurance Company, Madison Mutual, Reinsure), read in place, and the pre-SPEC_21 boppr.json 1.5.0.
# aliases: coverage names as the seeds print them (whitespace collapsed; a wrapped name joined with one space).
# L1 codes a printed row by its name (fideon/l1/spec21.py coverage_code_for), so every name a seed prints
# in a coverage schedule is an alias of exactly one code. Codes are LOB-prefixed (BOPPR_); a coverage the
# common model shares across lines uses its X_ code (common_model.json fideon:shared_coverage_codes);
# shared: true marks those. X_MED_PAY is listed here with this line's own default limit type (per_person:
# a businessowners medical payments limit is a per-person limit unless the row prints otherwise).
# Business liability rows (Coverage L, N, O, P) printed on a businessowners property declarations are coded
# here under BOPPR_ codes; CR-BOPPR-01 asks for shared X_ codes so they align with gl and bopgl.
# Rows that print an exclusion or a credit against a form number (LS-59 Lead Exclusion, BP 0331 Protective
# Devices) are not coverages: their premium is forms_and_endorsements[].premium.
# carriers: how many of the 3 seed carriers print one of the code's names.
# 2.2.0 (25 October 2026, additive): G1/bop review. The two businessowners declarations of the folder (Utica First
# Businessowners Special Policy with its Maximizer package endorsement; NYCM BP 00 03) print rows the line lacked: names of
# an existing concept were added as aliases of its code, a concept no code covered got a code on both lines (counterpart
# keys), and the printed package endorsements (Maximizer, Select Choice Plus, Policy Protector Pack, NYCM BOP Enhancement)
# stay forms_and_endorsements[].premium, not coverages. Nothing is removed or renamed.

# 2.3.0 (26 October 2026, additive): the coverage rows the G1 scanned and hybrid seeds printed that the line had no name or code for. Printed names
# of an existing concept became aliases; a concept no code covered got a code (LOB prefix; counterpart keys between bopgl and boppr). Nothing is
# removed or renamed.

