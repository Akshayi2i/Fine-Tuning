# SPEC_21 4.7 crosswalk for directors_officers: every field of the pre-SPEC_21 directors_officers.json (the
# _common-shaped envelope plus its directors_officers block, $defs expanded) and every canonical_path the line's
# policy registry YAMLs declared (config/document_registry/policy/*/directors_officers.yaml) -> the SPEC_21 schema
# named by to_schema. new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label;
# drop: not a value (needs reviewer approval). The envelope paths take the mapping the wc, auto, homeowners and
# dwelling_fire crosswalks give them where that target is in directors_officers.json; the directors_officers block
# is mapped by hand: a limit or insuring agreement to the coverage of its code, the claims-made provisions to
# claims_made_terms, the rest to its caption.
# Applied by tools/registry_migrate.py --lob directors_officers.

