# SPEC_21 4.7 crosswalk for umbrella: every field of the pre-SPEC_21 umbrella.json (1.6.0, the _common-shaped
# envelope plus its umbrella block, $defs expanded) and every canonical_path the line's policy registry YAMLs
# declared (config/document_registry/policy/*/umbrella.yaml) -> the SPEC_21 schema named by to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label; drop: not a value
# (needs reviewer approval). The envelope paths take the mapping the gl, wc, auto and homeowners crosswalks give
# them where that target is in umbrella.json; the umbrella block is mapped by hand: the layer's limits to the
# umbrella coverage, the schedule of underlying insurance to underlying_insurance[], retentions and the attachment
# point to attachment, the rest to its caption.
# Applied by tools/registry_migrate.py --lob umbrella.

