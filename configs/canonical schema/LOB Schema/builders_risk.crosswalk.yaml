# SPEC_21 4.7 crosswalk for builders_risk: every field of the pre-SPEC_21 builders_risk.json 2.2.0 (the
# _common-shaped envelope plus its builders_risk block, $defs expanded) and every canonical_path the line's policy
# registry YAMLs declared (config/document_registry/policy/*/builders_risk.yaml) -> the SPEC_21 schema named by
# to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label; drop: not a value
# (needs reviewer approval). The envelope paths take the mapping the wc, auto, homeowners and dwelling_fire
# crosswalks give them where that target is in builders_risk.json; the builders_risk block is mapped by hand: a
# limit, deductible or premium to its BR_ (or shared X_) coverage, the project site to locations[] and its building
# facts to buildings[], the per-peril deductibles to deductibles[], the additional interests to
# interested_parties[], the project facts and the e-signature certificate's header to their captions.
# Applied by tools/registry_migrate.py --lob builders_risk.

