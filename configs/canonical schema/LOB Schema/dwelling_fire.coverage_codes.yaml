# SPEC_21 4.2.4 coverage codes of dwelling_fire (schema 1.0.0, common model 1.0.0).
# Built from all 16 seed golds of 4 carriers (Dryden Mutual, Leatherstocking Cooperative Insurance Company, NYCM Insurance, North Country Insurance Company).
# aliases: coverage names as the seeds print them (whitespace collapsed; a dash the text layer has no
# Unicode for is written '-'). Codes are LOB-prefixed (DF_); a coverage the common model shares across
# lines uses its X_ code (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# carriers: how many of the line's carriers print the coverage. replaces_draft_codes: codes used by the
# engine-test seed golds for the same coverage; those golds are re-coded at seed review (see CHANGELOG).
lob: dwelling_fire
schema_version: 1.0.0
common_model_version: 1.0.0
code_prefix: DF_
codes:
- code: DF_COV_A
  name: Coverage A - Dwelling / Residence
  aliases:
  - Cov A - Dwelling
  - Coverage A - Residence
  - Coverage A RESIDENCE FIRE
  - Residence
  default_limit_types:
  - per_occurrence
  carriers: 4
  replaces_draft_codes:
  - HO_COV_A
- code: DF_COV_B
  name: Coverage B - Other / Related Private Structures
