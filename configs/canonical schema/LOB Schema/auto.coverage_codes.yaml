# SPEC_21 4.2.4 coverage codes of auto, commercial (business) auto (schema 2.0.0, common model 1.1.0).
# Built from the 11 single-LOB seed documents of 5 carriers (Glatfelter / National Union, The Hartford, Merchants
# Mutual, Preferred Mutual, Progressive), read in place: Item Two of the business auto declarations, each scheduled
# auto's coverage lines, Items Four and Five, and Progressive's outline of coverage.
# aliases: coverage names as the documents print them (whitespace collapsed). L1 codes a printed row by its name
# (fideon/l1/spec21.py coverage_code_for). Codes are LOB-prefixed (AU_); a coverage the common model shares across
# lines uses its X_ code (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# carriers: how many of the 5 carriers print the coverage.
lob: auto
schema_version: 2.1.0
common_model_version: 1.5.0
code_prefix: AU_
codes:
- code: X_VEHICLE_LIABILITY
  name: Liability (bodily injury and property damage) for an auto
  aliases:
  - Liability
  - Covered Autos Liability
  - Covered Autos Liability (combined single limit)
  - Liability To Others
  - Liability To Others-Incl Supplemental Spousal
  - Bodily Injury And Property Damage Liability
  # 2.1.0: Main Street America vehicle block (the liability limit on its own row)
  - Combined Single Limit
  # 30 October 2026 (Liberty Mutual Item Two, the name as printed; aliases only):
  - Liability Insurance
  default_limit_types:
  - combined_single
  - per_person
  - per_accident
  - property_damage
  shared: true
  carriers: 5
  note: 'Item Two''s liability row and each vehicle''s liability line. A combined single limit is one combined_single entry.'
- code: AU_SUPPLEMENTAL_SPOUSAL_LIABILITY
  name: Supplemental spousal liability (New York)
  aliases:
  - Supplemental Spousal Liability
  - Supplemental Spousal Liability Coverage
  - New York Supplemental Spousal Liability Coverage
  default_limit_types: []
  carriers: 3
  note: 'Printed as a row of its own (Glatfelter) or as part of the liability row''s name (Progressive).'
- code: X_PIP
  name: 'Personal injury protection / no-fault (basic, mandatory)'
  aliases:
  - Personal Injury Protection
  - Personal Injury
  - Personal Injury Protection (No-Fault)
  - Personal Injury Protection (or equivalent No-Fault coverage)
  - Personal Injury Protection (or equivalent No Fault Coverage)
  - Mandatory Personal Injury Protection
  - PIP
  # 26 October 2026 (Main Street America; the limits printed under PIP / O.B.E.L., aliases only):
  - Death Benefit
  - Maximum Monthly Work Loss
  - Other Necessary Expenses
  # 2.1.0: Guard and Liberty Mutual NY declarations
  - Mandatory PIP
  - Other Necessary Expenses (per day)
  # 30 October 2026 (Liberty Mutual Item Two, the name as printed over two rows; aliases only):
  - Personal Injury Protection or Equivalent No-fault Coverage - By State
  default_limit_types:
  - per_person
  - other
  - sublimit
  shared: true
  carriers: 5
  note: 'Basic (mandatory) no-fault. The monthly work loss, other necessary expenses and death benefit printed under it are its limits (sublimit or other, with the printed description).'
- code: AU_ADDITIONAL_PIP
  name: Additional (added) personal injury protection
  aliases:
  - Additional Personal Injury Protection
  - Additional PIP
  - Addl PIP
  - Added Personal Injury Protection
  - Added Personal Injury Protection (or equivalent added No-Fault coverage)
  - Additional PIP (or equivalent added No Fault Coverage)
  # 30 October 2026 (Liberty Mutual Item Two, the name as printed over two rows; aliases only):
  - Added Personal Injury Protection or Equivalent Added No-fault Coverage - By State
  default_limit_types:
  - per_person
  - sublimit
  - other
  carriers: 5
  note: 'Kept apart from X_PIP: New York commercial auto prints basic PIP, APIP and OBEL as separate coverages with their own premiums (as personal_auto PA_ADDITIONAL_PIP).'
- code: AU_OPTIONAL_BASIC_ECONOMIC_LOSS
  name: Optional basic economic loss (New York)
  aliases:
  - Optional Basic Economic Loss
  - Optional Basic Economic Loss Coverage
  - OBEL
  - Optional Basic Economic Loss (New York only)
  # 26 October 2026 (Main Street America, aliases only):
  - Optional Basic Economic Loss (O.B.E.L.)
  default_limit_types:
  - per_person
  carriers: 5
- code: AU_AGGREGATE_NO_FAULT_BENEFITS
  name: Aggregate no-fault benefits available
  aliases:
