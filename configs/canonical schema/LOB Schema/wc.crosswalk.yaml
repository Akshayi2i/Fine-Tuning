# SPEC_21 4.7 crosswalk for wc: every field of the pre-SPEC_21 wc.json 1.6.0
# (fideon.canonical.workers_compensation, also the fine-tuning repository's configs/canonical schema/
# LOB Schema/wc.json) and every canonical_path the line's policy registry YAMLs declare
# (config/document_registry/policy/*/wc.yaml) -> the SPEC_21 schema named by to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label;
# drop: not a value (needs reviewer approval). Paths already under additional_fields keep their label.
# Legacy array leaves are written with [] as the legacy schema nests them. The envelope paths the legacy
# generator (scripts/build_canonical_policy.py) shares with gl's legacy schema take gl.crosswalk.yaml's
# mapping, except where workers compensation reads them differently (square footage and occupancy are
# overflow; the terrorism charge is a premium line, not a coverage). Applied by
# tools/registry_migrate.py --lob wc.

