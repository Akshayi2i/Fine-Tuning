# SPEC_21 4.2.4 coverage codes of bopgl (schema 2.3.0, common model 1.4.0).
# Built from the 8 single-LOB businessowners liability seed documents with a native text layer (coterie 6,
# Leatherstocking Cooperative Insurance Company 2), read in place, and the pre-SPEC_21 bopgl.json.
# aliases: coverage names and limit captions as the seeds print them (whitespace collapsed; a wrapped name joined
# with one space; a dash the text layer has no Unicode for is written '-'). L1 codes a printed row by its name
# (fideon/l1/spec21.py coverage_code_for), so every name a seed prints in a coverage schedule is an alias of
# exactly one code. Codes are LOB-prefixed (BOPGL_); a coverage the common model shares across lines uses its
# X_ code (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# A businessowners declarations prints Section I property beside Section II liability, so both are coded here.
# The liability rows use BOPGL_ codes until shared codes exist (CR-BOPPR-01 / CR-BOPGL-01).
# Rows that print an exclusion or a credit against a form (Extended Pollution Exclusion -$5.00) are not
# coverages: their premium is forms_and_endorsements[].premium; a credit naming no form is premium.discounts[].
# carriers: how many of the 2 native seed carriers print one of the code's names.
# 2.2.0 (25 October 2026, additive): G1/bop review. The two businessowners declarations of the folder (Utica First
# Businessowners Special Policy with its Maximizer package endorsement; NYCM BP 00 03) print rows the line lacked: names of
# an existing concept were added as aliases of its code, a concept no code covered got a code on both lines (counterpart
# keys), and the printed package endorsements (Maximizer, Select Choice Plus, Policy Protector Pack, NYCM BOP Enhancement)
# stay forms_and_endorsements[].premium, not coverages. Nothing is removed or renamed.

# 2.3.0 (26 October 2026, additive): the coverage rows the G1 scanned and hybrid seeds printed that the line had no name or code for. Printed names
# of an existing concept became aliases; a concept no code covered got a code (LOB prefix; counterpart keys between bopgl and boppr). Nothing is
# removed or renamed.

