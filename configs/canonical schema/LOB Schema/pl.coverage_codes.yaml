# SPEC_21 4.2.4 coverage codes of pl, Professional Liability (schema 1.0.0, common model 1.1.0).
# DECISIONS_2026-10-19 row 48 (built 21 October 2026, for review): Professional Liability is its own
# line, apart from Errors & Omissions (professional_eo). The codes are professional_eo.coverage_codes.yaml
# as of that date: that table was built from the pl source folder first (Benchmark, Coterie, CNA,
# Hartford, Nationwide, Travelers), hence its PL_ prefix, and the professional liability insuring
# agreements and extensions it names are the ones these declarations print (per claim / aggregate,
# retention, the claims-made terms). The owner may prune either table once the two lines' seeds are
# split (CHANGE_REQUESTS_pl.md CR-PLL-01).
