# SPEC_21 4.2.4 coverage codes of health (schema 1.0.0).
# Built from the 4 single-LOB health seed documents with a native text layer (Shelterpoint 2: New York DBL and PFL;
# Glatfelter Insurance Group 2: VFIS volunteer accident and sickness), read in place.
# aliases: benefit names as the seeds print them, without the schedule's outline numbering ('(1)', 'A.', 'IV.')
# and dot leaders (whitespace collapsed). L1 codes a printed row by its name (fideon/l1/spec21.py
# coverage_code_for), so every name a seed prints in a benefit schedule is an alias of exactly one code. Codes are
# LOB-prefixed (HEALTH_). A benefit printed 'NONE' is not provided: included not_purchased, no limit.
# carriers: how many of the 2 native seed carriers print one of the code's names.
lob: health
schema_version: 1.0.0
common_model_version: 1.1.0
code_prefix: HEALTH_
