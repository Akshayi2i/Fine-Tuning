# envelope plus its inland_marine block, $defs expanded) and every canonical_path the line's policy registry YAMLs
# declared (config/document_registry/policy/*/inland_marine.yaml) -> the SPEC_21 schema named by to_schema.
# new: same concept at its SPEC_21 path; overflow: an additional_fields entry with that label; drop: not a value
# (needs reviewer approval). The envelope paths take the mapping the wc, auto, homeowners and dwelling_fire
# crosswalks give them where that target is in inland_marine.json; the inland_marine block is mapped by hand: a
# scheduled item to scheduled_items[], a limit to the coverage it limits, the rest to its caption.
# Applied by tools/registry_migrate.py --lob inland_marine.

