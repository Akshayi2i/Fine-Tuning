# SPEC_21 4.2.4 coverage codes of cyber (schema 2.0.0, common model 1.1.0).
# Built from the single-LOB cyber declarations of the cyber folder (At-Bay under AtBay and ARC Excess & Surplus,
# Coalition, Corvus on Travelers paper), read in place, and the pre-SPEC_21 cyber.json. aliases: insuring
# agreement names as the seeds print them. Codes are LOB-prefixed (CY_, provisional); X_TERRORISM is the common
# model's shared code. An insuring agreement's sub-limit is an aggregate limit; its retention a retention
# deductible; a waiting period a waiting_period deductible.
# carriers: how many of the seed carrier folders print one of the code's names.
