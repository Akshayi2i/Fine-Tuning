# SPEC_21 4.2.4 coverage codes of homeowners (schema 1.0.0, common model 1.0.0).
# Built from all 37 seed golds of 11 carriers (Chubb, Dryden Mutual, Leatherstocking Cooperative Insurance Company, Madison Mutual, Mercury Insurance Company, Midstate Mutual Insurance Company, Millennial Specialty Insurance, NYCM Insurance, North Country Insurance Company, Plymouth, Travelers).
# aliases: coverage names as the seeds print them (whitespace collapsed; a dash the text layer has no
# Unicode for is written '-'). Codes are LOB-prefixed (HO_); a coverage the common model shares across
# lines uses its X_ code (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# carriers: how many of the line's carriers print the coverage. replaces_draft_codes: codes used by the
# engine-test seed golds for the same coverage; those golds are re-coded at seed review (see CHANGELOG).
