# SPEC_21 4.2.4 coverage codes of builders_risk (schema 3.0.0, common model 1.1.0).
# Built from the bldrk folder's documents, read in place (Zurich's builders risk supplemental declarations, forms
# U-GU / HBIS, for the captions; US Assure's renewal application and Vacant Express's invoice print no coverage)
# and the pre-SPEC_21 builders_risk.json limits, deductibles and time-element blocks.
# aliases: coverage names as the documents print them. Codes are LOB-prefixed (BR_, provisional,
# CHANGE_REQUESTS_builders_risk.md CR-BR-01); X_ORDINANCE_LAW, X_WATER_BACKUP and X_TERRORISM are the common
# model's shared codes (shared: true). The ordinance or law parts the supplemental declarations print on their own
# rows (undamaged portion, demolition cost, increased cost of construction) have BR_OL_ codes.
# carriers: how many of the bldrk carrier folders print one of the code's names (0 = a legacy-schema field only).
lob: builders_risk
schema_version: 3.0.0
common_model_version: 1.1.0
code_prefix: BR_
