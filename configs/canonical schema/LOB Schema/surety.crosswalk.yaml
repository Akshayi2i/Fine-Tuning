# SPEC_21 4.7 crosswalk for surety: every field of the pre-SPEC_21 surety.json (the _common-shaped envelope plus
# its surety block, $defs expanded) -> the SPEC_21 schema named by to_schema. new: same concept at its SPEC_21
# path; overflow: an additional_fields entry with that label; drop: not a value (needs reviewer approval). The
# envelope paths take the mapping the wc, auto, homeowners and dwelling_fire crosswalks give them where that
# target is in surety.json; the surety block is mapped by hand: the bond's facts to the common model's bond block,
# the principal to the named insured, the surety to the carrier, the rest to its caption.
# Applied by tools/registry_migrate.py --lob surety (the line's one registry YAML declares no canonical_paths).

lob: surety
from_schema: "3.1.0"
to_schema: "4.0.0"
